<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Clock & Calendar Icon Graphic -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="116" y="140" width="280" height="256" rx="40" fill="#ffffff" />
    <!-- Calendar Top Header Strip -->
    <path d="M 116 180 Q 116 140 156 140 L 356 140 Q 396 140 396 180 L 396 210 L 116 210 Z" fill="#4f46e5" />
    <!-- Calendar Rings -->
    <rect x="180" y="112" width="24" height="48" rx="12" fill="#e0e7ff" />
    <rect x="308" y="112" width="24" height="48" rx="12" fill="#e0e7ff" />
    <!-- Clock face inside calendar -->
    <circle cx="256" cy="300" r="64" fill="#f8fafc" stroke="#4f46e5" stroke-width="12" />
    <!-- Clock hands -->
    <line x1="256" y1="300" x2="256" y2="260" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <line x1="256" y1="300" x2="288" y2="300" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="300" r="7" fill="#4338ca" />
  </g>
</svg>
